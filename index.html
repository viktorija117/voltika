<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Open the connections to the API and the image CDN early. -->
    <link rel="preconnect" href="https://dummyjson.com" crossorigin />
    <link rel="preconnect" href="https://cdn.dummyjson.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Body and heading fonts are needed on every page: start downloading them before the CSS is parsed.
         Serbian text always uses latin-ext (č, ć, š, ž, đ), so the body font's ext subset is preloaded too. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/inter-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Voltika</title>
    <!-- Defaults until the app sets each page's own tags. -->
    <meta
      name="description"
      content="Voltika je demo prodavnica tehnike: telefoni, laptopovi, tableti, oprema i satovi."
    />
    <meta name="theme-color" content="#0e0f12" />
    <!-- The shop is dark-only: native controls, scrollbars and autofill follow it. -->
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voltika" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
